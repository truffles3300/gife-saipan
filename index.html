<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ให้สายป่าน🤍</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div class="envelope" onclick="openLetter()">
    💌
    <p>แตะเพื่อเปิด</p>
  </div>
</div>

<!-- MAIN -->
<div id="main">

<h1 class="fadeUp">Happy Valentine's Day 🤍</h1>
<p class="fadeUp delay1">EIEI</p>

<div class="btnGroup">
<button class="readBtn" onclick="openReading()">📖 อ่านเอาน้อง</button>
<button class="photoBtn" onclick="toggleGallery()">📸 รูปน้อง</button>
</div>

<div id="gallery">
<img src="images/p1.jpg">
<img src="images/p2.gif">
<img src="images/p3.jpg">
</div>

<div class="musicPlayer">
<button onclick="toggleMusic()">🎵</button>
<input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
</div>

</div>

<!-- READING MODE -->
<div id="readingMode">
  <div class="readingBox">

    <p class="line">ตั้งแต่ได้เจอ</p>
    <p class="line">เธอทำให้เค้าตลอดจนเค้าจะเป็นง่อย</p>
    <p class="line">ขอบคุณน้าาที่ทำให้เค้าขนาดนี้</p>
    <p class="line">เค้าหวานไม่เก่งหรอก</p>
    <p class="line">เค้ารักเธอนะ Happy Valentine Dayนะ😙🤍 </p>

    <button class="closeBtn" onclick="closeReading()">ปิด</button>

  </div>
</div>

<audio id="music" loop>
<source src="music.mp3">
</audio>

<audio id="heartbeat" loop>
<source src="heartbeat.mp3">
</audio>

<script src="script.js"></script>
</body>
</html>
